<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Blender Render</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="13" r="2.6" fill="currentColor"/><path d="M5 9 2 6.5M12 6V2.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <span>Blender Render</span>
  </div>
  <div class="sys" id="sys">Checking GPU…</div>
</header>

<main class="wrap">
  <section class="card">
    <h1>New render</h1>
    <form id="form" autocomplete="off">
      <label class="drop" id="drop">
        <input type="file" id="file" accept=".blend,.zip" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16V4m0 0-4.5 4.5M12 4l4.5 4.5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="drop-main" id="drop-main">Drop a <b>.blend</b> file here, or click to choose</span>
        <span class="drop-sub" id="drop-sub">Using textures that aren't packed? Zip the .blend together with its texture folders and upload the .zip.</span>
      </label>

      <div class="opts">
        <div class="field wide">
          <span class="lbl">Render</span>
          <div class="seg">
            <label><input type="radio" name="mode" value="still" checked><span>Still image</span></label>
            <label><input type="radio" name="mode" value="animation"><span>Animation</span></label>
          </div>
        </div>

        <label class="field" data-show="still">
          <span class="lbl">Frame</span>
          <input type="number" name="frame" placeholder="Current frame">
        </label>
        <label class="field" data-show="animation" hidden>
          <span class="lbl">Start frame</span>
          <input type="number" name="frame_start" placeholder="From file">
        </label>
        <label class="field" data-show="animation" hidden>
          <span class="lbl">End frame</span>
          <input type="number" name="frame_end" placeholder="From file">
        </label>

        <label class="field">
          <span class="lbl">Engine</span>
          <select name="engine">
            <option value="file">As saved in the file</option>
            <option value="cycles">Cycles</option>
            <option value="eevee">Eevee</option>
            <option value="workbench">Workbench</option>
          </select>
        </label>
        <label class="field">
          <span class="lbl">Cycles device</span>
          <select name="device">
            <option value="gpu">GPU (Colab)</option>
            <option value="cpu">CPU</option>
          </select>
        </label>
        <label class="field">
          <span class="lbl">Samples</span>
          <input type="number" name="samples" min="1" max="65536" placeholder="From file">
        </label>
        <label class="field">
          <span class="lbl">Resolution %</span>
          <input type="number" name="resolution_pct" min="1" max="100" placeholder="From file">
        </label>
        <label class="field">
          <span class="lbl">Image format</span>
          <select name="format">
            <option value="PNG">PNG</option>
            <option value="JPEG">JPEG</option>
            <option value="OPEN_EXR">OpenEXR</option>
          </select>
        </label>
        <label class="check" data-show="animation" hidden>
          <input type="checkbox" name="video" checked> Also make an MP4 video
        </label>
      </div>
      <p class="hint" id="eevee-hint" hidden>Eevee needs a display/OpenGL and may fail on Colab. Cycles on the GPU is the reliable choice.</p>

      <div class="actions">
        <button type="submit" class="btn primary" id="go" disabled>Upload &amp; render</button>
        <div class="up" id="up" hidden>
          <div class="bar-track"><div class="bar-fill" id="up-fill"></div></div>
          <span id="up-text">0%</span>
        </div>
      </div>
      <p class="msg" id="msg" hidden></p>
    </form>
  </section>

  <section>
    <h2 class="sec-h">Renders</h2>
    <div id="jobs"><p class="empty">Nothing rendered yet. Upload a file above.</p></div>
  </section>
</main>

<template id="job-tpl">
  <article class="card job">
    <div class="job-head">
      <div class="job-title">
        <b class="job-name"></b>
        <span class="job-meta"></span>
      </div>
      <span class="badge"></span>
    </div>
    <div class="bar-track"><div class="bar-fill"></div></div>
    <div class="job-stats"></div>
    <p class="job-error" hidden></p>
    <div class="job-actions">
      <a class="btn sm" data-act="zip" hidden>Download all (.zip)</a>
      <a class="btn sm" data-act="video" hidden>Download MP4</a>
      <button type="button" class="btn sm" data-act="cancel" hidden>Cancel</button>
      <button type="button" class="btn sm ghost" data-act="log">Show log</button>
      <button type="button" class="btn sm ghost" data-act="delete">Delete</button>
    </div>
    <video class="job-video" controls preload="metadata" hidden></video>
    <div class="gallery"></div>
    <pre class="log" hidden></pre>
  </article>
</template>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
